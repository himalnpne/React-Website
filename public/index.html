    <!-- SPA AND PERFORMANCE SCRIPTS -->
    <script>
      (function () {
        // Set language attribute
        document.documentElement.lang = 'en';
        
        // Handle SPA routing
        const currentPath = window.location.pathname;
        const currentHash = window.location.hash;
        
        // Store path for React Router
        if (currentPath !== '/' && !currentPath.endsWith('.html')) {
          sessionStorage.setItem('redirectPath', currentPath + currentHash);
        }
        
        // Remove loading screen after timeout
        setTimeout(function() {
          var loadingElement = document.querySelector('.app-loading');
          if (loadingElement && !loadingElement.classList.contains('hidden')) {
            loadingElement.classList.add('hidden');
          }
        }, 2000);
        
        // Initialize after DOM is ready
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', initApp);
        } else {
          initApp();
        }
        
        function initApp() {
          // Remove loading screen
          setTimeout(() => {
            var loadingElement = document.querySelector('.app-loading');
            if (loadingElement) {
              loadingElement.classList.add('hidden');
            }
          }, 100);
        }
        
      })();
    </script>

    <!-- ENHANCED SCROLL RESET FIX - Forces scroll to top on ALL devices including mobile -->
    <script>
      (function() {
        // AGGRESSIVE SCROLL TO TOP FOR ALL DEVICES
        
        // Disable automatic scroll restoration
        try {
          window.history.scrollRestoration = 'manual';
        } catch (e) {
          console.log('Scroll restoration not supported');
        }
        
        // Function to force scroll to top using multiple methods
        function forceScrollToTop() {
          try {
            // Method 1: Standard scrollTo
            window.scrollTo(0, 0);
            
            // Method 2: Scroll to document element
            document.documentElement.scrollTop = 0;
            
            // Method 3: Scroll to body
            document.body.scrollTop = 0;
            
            // Method 4: Scroll to root element
            document.getElementById('root')?.scrollTo(0, 0);
            
            // Method 5: Use scrollIntoView on a hidden element at the top
            let topMarker = document.getElementById('scroll-top-marker');
            if (!topMarker) {
              topMarker = document.createElement('div');
              topMarker.id = 'scroll-top-marker';
              topMarker.style.position = 'absolute';
              topMarker.style.top = '0';
              topMarker.style.left = '0';
              topMarker.style.width = '1px';
              topMarker.style.height = '1px';
              topMarker.style.opacity = '0';
              topMarker.style.pointerEvents = 'none';
              document.body.prepend(topMarker);
            }
            topMarker.scrollIntoView({ behavior: 'auto', block: 'start' });
          } catch (e) {
            console.log('Scroll method failed:', e);
          }
        }
        
        // Call immediately
        forceScrollToTop();
        
        // Call on DOM ready
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', function() {
            forceScrollToTop();
            document.body.classList.add('loaded');
          });
        } else {
          forceScrollToTop();
          document.body.classList.add('loaded');
        }
        
        // Call on page load
        window.addEventListener('load', function() {
          forceScrollToTop();
        });
        
        // Call on page show (for bfcache/back-forward)
        window.addEventListener('pageshow', function(event) {
          forceScrollToTop();
        });
        
        // Handle touch events that might cause scroll on mobile
        window.addEventListener('touchstart', function() {
          // Small delay to allow touch to complete
          setTimeout(forceScrollToTop, 10);
        }, { passive: true });
        
        // Handle orientation change on mobile
        window.addEventListener('orientationchange', function() {
          setTimeout(forceScrollToTop, 100);
        });
        
        // Handle resize
        window.addEventListener('resize', function() {
          setTimeout(forceScrollToTop, 100);
        });
        
        // Handle back/forward navigation
        window.addEventListener('popstate', function() {
          setTimeout(forceScrollToTop, 0);
          setTimeout(forceScrollToTop, 50);
          setTimeout(forceScrollToTop, 100);
        });
        
        // Override history methods for SPA navigation
        const originalPushState = history.pushState;
        const originalReplaceState = history.replaceState;
        
        history.pushState = function() {
          originalPushState.apply(this, arguments);
          setTimeout(forceScrollToTop, 0);
          setTimeout(forceScrollToTop, 50);
        };
        
        history.replaceState = function() {
          originalReplaceState.apply(this, arguments);
          setTimeout(forceScrollToTop, 0);
          setTimeout(forceScrollToTop, 50);
        };
        
        // Handle all link clicks
        document.addEventListener('click', function(e) {
          const link = e.target.closest('a');
          if (link && link.href && link.href.indexOf(window.location.origin) === 0) {
            // Internal link - scroll to top after navigation
            setTimeout(forceScrollToTop, 0);
            setTimeout(forceScrollToTop, 50);
            setTimeout(forceScrollToTop, 100);
          }
        }, true);
        
        // Aggressive timeouts to ensure scroll is at top
        setTimeout(forceScrollToTop, 10);
        setTimeout(forceScrollToTop, 50);
        setTimeout(forceScrollToTop, 100);
        setTimeout(forceScrollToTop, 200);
        setTimeout(forceScrollToTop, 500);
        setTimeout(forceScrollToTop, 1000);
        
        // Also handle any scroll events and immediately scroll back up
        let preventScrollRestoration = true;
        window.addEventListener('scroll', function() {
          if (preventScrollRestoration && window.scrollY > 0) {
            forceScrollToTop();
          }
        }, { passive: false });
        
        // After a short delay, allow normal scrolling (but page should already be at top)
        setTimeout(function() {
          preventScrollRestoration = false;
        }, 1500);
        
      })();
    </script>
