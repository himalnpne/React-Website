    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto',
          'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans',
          'Helvetica Neue', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        height: 100%;
        width: 100%;
        line-height: 1.5;
        color: #343434;
        background: #f9f6ee;
      }

      #root {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .app-loading {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #ffffff 0%, #fafafa 100%);
        color: #343434;
        font-size: 1.8rem;
        font-weight: 500;
        z-index: 9999;
        opacity: 1;
        transition: opacity 0.3s ease-out;
        gap: 1.5rem;
      }

      .app-loading.hidden {
        opacity: 0;
        pointer-events: none;
      }

      .app-loading .loader-logo {
        width: 80px;
        height: 80px;
        animation: pulse 1.2s ease-in-out infinite;
      }

      .app-loading .loader-text {
        font-size: 1.2rem;
        font-weight: 400;
        color: #8b0000;
        letter-spacing: 2px;
      }

      .app-loading .loader-spinner {
        width: 40px;
        height: 40px;
        border: 4px solid #e0ddd5;
        border-top-color: #8b0000;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.05);
        }
      }

      noscript {
        display: block;
      }

      noscript > div {
        max-width: 800px;
        margin: 0 auto;
        padding: 2rem;
        line-height: 1.6;
      }

      noscript h1 {
        font-size: 2.5rem;
        margin-bottom: 1rem;
        line-height: 1.2;
        color: #343434;

      noscript h2 {

      noscript h3 {

        margin: 1.5rem 0 1rem;
        color: #343434;
      }

      a {
        color: #8b0000;
        text-decoration: none;
        transition: color 0.2s;
      }

      a:hover {
        text-decoration: underline;
      }

      @media (max-width: 768px) {
        .app-loading .loader-logo {
          width: 60px;
          height: 60px;
        }
        .app-loading .loader-text {
          font-size: 1rem;
        }
        noscript h1 {

        }
        noscript h2 {
          font-size: 1.5rem;
        }
        noscript h3 {
          font-size: 1.25rem;
        }
        noscript > div {
          padding: 1rem;
        }
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 20px;
      }

    <!-- LOADING SCREEN SCRIPT -->
    <script>
      (function () {
        document.documentElement.lang = 'en';

        // Store SPA redirect path
        const currentPath = window.location.pathname;
        const currentHash = window.location.hash;
        if (currentPath !== '/' && !currentPath.endsWith('.html')) {
          sessionStorage.setItem('redirectPath', currentPath + currentHash);
        }

        // Hide loading screen once DOM is ready
        function hideLoader() {
          var loader = document.querySelector('.app-loading');
          if (loader) loader.classList.add('hidden');
          document.body.style.overflowY = 'auto';
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', function () {
            setTimeout(hideLoader, 100);
          });
        } else {
          setTimeout(hideLoader, 100);
        }

        // Fallback: force hide after 2s in case React is slow
        setTimeout(hideLoader, 2000);
      })();
    </script>

    <!-- SCROLL RESET SCRIPT (navigation only, mobile safe) -->
    <script>
      (function () {
        // Disable browser's automatic scroll restoration — we handle it ourselves
        try {
          window.history.scrollRestoration = 'manual';
        } catch (e) {}

        function scrollToTop() {
          window.scrollTo(0, 0);
          document.documentElement.scrollTop = 0;
          document.body.scrollTop = 0;
        }

        // Scroll to top on initial page load
        window.addEventListener('load', scrollToTop);

        // Scroll to top when restoring from bfcache (browser back/forward cache)
        window.addEventListener('pageshow', function (e) {
          if (e.persisted) scrollToTop();
        });

        // Intercept React Router's history.pushState (SPA navigation)
        var originalPushState = history.pushState;
        history.pushState = function () {
          originalPushState.apply(this, arguments);
          setTimeout(scrollToTop, 0);
        };

        // Intercept history.replaceState (redirects, route normalization)
        var originalReplaceState = history.replaceState;
        history.replaceState = function () {
          originalReplaceState.apply(this, arguments);
          setTimeout(scrollToTop, 0);
        };

        // Browser back/forward buttons
        window.addEventListener('popstate', function () {
          setTimeout(scrollToTop, 0);
        });
      })();
    </script>
