<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>404 – Page Not Found | Himal Neupane</title>
  <meta name="robots" content="noindex" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      line-height: 1.6;
      color: #333;
      max-width: 600px;
      margin: 0 auto;
      padding: 40px 20px;
      text-align: center;
    }
    h1 {
      font-size: 4rem;
      margin: 0;
      color: #007bff;
    }
    p {
      font-size: 1.2rem;
      margin: 20px 0 30px;
    }
    a {
      display: inline-block;
      padding: 12px 30px;
      background: #007bff;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
      transition: background 0.3s;
    }
    a:hover {
      background: #0056b3;
    }
  </style>
  <script>
    // Store the 404 path for React Router to handle
    const fullPath = window.location.pathname + window.location.search + window.location.hash;
    
    if (fullPath !== '/') {
      sessionStorage.setItem('redirectPath', fullPath);
    }
    
    // Redirect to homepage
    window.location.href = '/';
  </script>
</head>
<body>
  <h1>404</h1>
  <p>Page not found. Redirecting to homepage...</p>
  <p>If you are not redirected automatically, <a href="/">click here</a>.</p>
</body>
</html>
