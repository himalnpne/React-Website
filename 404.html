<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>404 – Page Not Found</title>
  <meta name="robots" content="noindex" />
</head>
<body>
  <script>
    // Store path for SPA recovery
    sessionStorage.setItem("redirectPath", location.pathname);
  </script>

  <h1>404</h1>
  <p>Page not found.</p>
  <a href="/">Go Home</a>
</body>
</html>
