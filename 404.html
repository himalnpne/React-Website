<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
      // Store the intended path and redirect to index.html with a parameter
      const path = location.pathname;
      sessionStorage.redirect = path;
      location.replace('/?redirect=' + encodeURIComponent(path));
    </script>
    <meta http-equiv="refresh" content="0; URL=/" />
  </head>
  <body>
    <p>Redirecting to <a href="/">home page</a>...</p>
  </body>
</html>
